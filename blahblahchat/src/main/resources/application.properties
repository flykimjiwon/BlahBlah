##it will be set build date by gradle. if this value is @build.date@, front-end is development mode
server.port=8080
#server.address=localhost
server.servlet.contextPath=/
# Charset of HTTP requests and responses. Added to the "Content-Type" header if not set explicitly.
server.servlet.encoding.charset=UTF-8
# Enable http encoding support.
server.servlet.encoding.enabled=true
# Force the encoding to the configured charset on HTTP requests and responses.
server.servlet.encoding.force=true


#
#database
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
spring.jpa.hibernate.naming.physical-strategy=org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
spring.data.web.pageable.one-indexed-parameters=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.username=blah
spring.datasource.hikari.password=${BLAHBLAH_CHAT_DB_PASSWORD:}
spring.datasource.url=jdbc:mysql://172.26.1.53:3306/blah_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true

#
##logging
#logging.file.name=./ssafy-web.log
#logging.level.root=INFO
#logging.level.com.samsung.security=DEBUG
#logging.level.org.springframework.web=DEBUG
#logging.level.org.apache.tiles=INFO
logging.level.com.ssafy.blahblahchat=INFO
#logging.level.org.sringframework.security=DEBUG
#
spring.devtools.livereload.enabled=true
#
##gzip compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
#
##for health check
management.servlet.context-path=/manage
management.health.db.enabled=true
management.health.default.enabled=true
management.health.diskspace.enabled=true
#
#
## EMBEDDED SERVER CONFIGURATION
#
#
###ssl
server.ssl.key-store=classpath:keystore/keystore.p12
server.ssl.key-store-password=${BLAHBLAH_CHAT_SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
trust.store=classpath:keystore/keystore.p12
trust.store.password=${BLAHBLAH_CHAT_SSL_TRUSTSTORE_PASSWORD:}


## Swagger
springfox.documentation.swagger.use-model-v3=false


spring.data.mongodb.host=172.26.1.53
spring.data.mongodb.port=27017
spring.data.mongodb.database=test

# AWS Account Credentials
cloud.aws.credentials.accessKey=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secretKey=${AWS_SECRET_ACCESS_KEY}

# AWS S3 bucket Info
cloud.aws.s3.bucket=blahblah-ssafy
cloud.aws.region.static=ap-northeast-2
cloud.aws.stack.auto=false

# file upload max size
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# jwt
jwt.secret=${JWT_SECRET}
# unit is ms. 15 * 24 * 60 * 60 * 1000 = 15days
jwt.expiration=1296000000
